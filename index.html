<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choir Portal - Advanced Cloud Sync Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #2196F3;
            --admin-color: #4caf50;
            --library-color: #9c27b0;
            --danger-color: #f44336;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 600px; }
        .hidden { display: none !important; }
        
        .box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        
        input, textarea, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #333;
            box-sizing: border-box;
            font-size: 16px;
        }
        input, textarea, select { background: #2a2a2a; color: white; }
        textarea { height: 100px; resize: vertical; }
        
        button { background: var(--accent-color); color: white; font-weight: bold; cursor: pointer; border: none;}
        .btn-admin { background: var(--admin-color); }
        .btn-library { background: var(--library-color); }
        .btn-secondary { background: #555; }
        .btn-danger { background: var(--danger-color); padding: 6px 10px; width: auto; font-size: 13px; margin: 0;}
        .btn-edit { background: #ff9800; padding: 6px 10px; width: auto; font-size: 13px; margin: 0; margin-right: 5px;}
        .btn-shift { background: #e91e63; margin-top: 5px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .hymn-card {
            background: var(--card-bg);
            margin: 12px 0;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
            cursor: pointer;
        }
        .hymn-card.lib-card { border-left-color: var(--library-color); }
        .hymn-section { font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: 1px; }
        .hymn-title { font-size: 18px; font-weight: bold; margin: 5px 0; color: #fff; }
        .lyrics { margin-top: 10px; white-space: pre-line; color: #ccc; line-height: 1.6; font-size: 17px; display: none; }
        .active .lyrics { display: block; }
        
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #333; }
        
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-buttons button { margin: 0; padding: 10px; font-size: 14px; }
        
        .week-toggle { display: flex; gap: 5px; margin-bottom: 15px; background: #222; padding: 5px; border-radius: 8px; }
        .week-toggle button { margin: 0; padding: 8px; font-size: 13px; }
        .active-toggle { background: #444 !important; border: 1px solid #666; }
        
        .search-bar { background: #2a2a2a; border: 1px solid #333; color: white; padding: 10px; border-radius: 6px; margin-bottom: 15px; width: 100%; box-sizing: border-box; font-size: 16px;}
        .lib-item { padding: 10px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .lib-actions { display: flex; align-items: center; }
        
        .filter-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .filter-row input, .filter-row select { margin: 0; }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="login-screen" class="box" style="margin-top: 80px; text-align: center;">
            <h2>Choir App Portal</h2>
            <p>Enter your access password:</p>
            <input type="password" id="password-input" placeholder="Enter password...">
            <button onclick="handleLogin()">Enter Dashboard</button>
            <p id="error-msg" style="color: #ff5252;" class="hidden">Invalid credentials. Try again.</p>
        </div>

        <div id="member-dashboard" class="hidden">
            <div class="nav-header">
                <h2>Choir Portal</h2>
                <button onclick="logout()" class="btn-secondary" style="width: auto; margin: 0; padding: 6px 12px; font-size: 14px;">Exit</button>
            </div>

            <div class="tab-buttons">
                <button id="btn-mem-sunday" onclick="switchMemberTab('sunday')" class="btn-admin">📅 Sunday Setlists</button>
                <button id="btn-mem-lib" onclick="switchMemberTab('library')" class="btn-secondary">🎵 Full Song Library</button>
            </div>

            <div id="tab-member-sunday">
                <div class="week-toggle">
                    <button id="btn-mem-week1" onclick="switchMemberWeek('week1')" class="active-toggle">Current Week</button>
                    <button id="btn-mem-week2" onclick="switchMemberWeek('week2')">Next Week</button>
                </div>
                <h3 id="view-date" style="color: var(--accent-color); margin-bottom: 10px;">Loading live database...</h3>
                <div id="setlist-render-area"></div>
            </div>

            <div id="tab-member-library" class="hidden">
                <h3>Master Hymn Database</h3>
                <input type="text" id="member-search" class="search-bar" placeholder="🔍 Search hymns by title..." oninput="filterMemberLibrary()">
                <div id="member-library-render-area"></div>
            </div>
        </div>

        <div id="admin-dashboard" class="hidden">
            <div class="nav-header">
                <h2>Admin Control Center</h2>
                <button onclick="logout()" class="btn-secondary" style="width: auto; margin: 0; padding: 6px 12px; font-size: 14px;">Exit Admin</button>
            </div>

            <div class="tab-buttons">
                <button id="btn-adm-sunday" onclick="switchAdminTab('setlist')" class="btn-admin">1. Plan Sunday</button>
                <button id="btn-adm-lib" onclick="switchAdminTab('library')" class="btn-secondary">2. Manage Song Library</button>
            </div>
            
            <div id="tab-sunday-planner">
                <div class="week-toggle">
                    <button id="btn-adm-week1" onclick="switchAdminWeek('week1')" class="active-toggle">Edit Current Week</button>
                    <button id="btn-adm-week2" onclick="switchAdminWeek('week2')">Edit Next Week</button>
                </div>

                <div id="shift-action-container" class="hidden">
                    <button onclick="shiftNextWeekToCurrent()" class="btn-shift">📋 Paste Next Week's Setlist to Current Week</button>
                </div>

                <div class="box">
                    <label>Target Sunday Date:</label>
                    <input type="text" id="edit-date" placeholder="e.g., Sunday, May 31, 2026">
                </div>

                <div class="box">
                    <h3>Configure Liturgical Layout</h3>
                    <div id="admin-form-fields"></div>
                </div>

                <button onclick="saveAdminData()" class="btn-admin">Publish Selected Sunday Setlist</button>
            </div>

            <div id="tab-library-manager" class="hidden">
                <div class="box">
                    <h3 id="library-form-title">Add New Song to Library</h3>
                    <label>Song Title:</label>
                    <input type="text" id="lib-new-title" placeholder="e.g., Amazing Grace">
                    
                    <label>Liturgical Category:</label>
                    <select id="lib-new-category"></select>
                    
                    <label>Song Lyrics:</label>
                    <textarea id="lib-new-lyrics" placeholder="Paste entire song lyrics here..."></textarea>
                    
                    <button id="btn-library-save" onclick="addNewSongToLibrary()" class="btn-library">Save New Song</button>
                    <div id="edit-action-block" class="hidden" style="display: flex; gap: 10px;">
                        <button onclick="updateExistingSong()" class="btn-admin" style="margin: 0;">Update Changes</button>
                        <button onclick="cancelLibraryEdit()" class="btn-secondary" style="margin: 0;">Cancel Edit</button>
                    </div>
                </div>

                <div class="box">
                    <h3>Your Saved Songs Master List</h3>
                    
                    <div class="filter-row">
                        <input type="text" id="admin-search" placeholder="🔍 Search by title..." oninput="filterAndRenderAdminLibrary()">
                        <select id="admin-filter-category" onchange="filterAndRenderAdminLibrary()">
                            </select>
                    </div>

                    <div id="library-preview-list" style="max-height: 350px; overflow-y: auto; font-size: 14px;"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const CLOUD_URL = "https://oighotwtvrzyiqslpeso.supabase.co";
        const CLOUD_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pZ2hvdHd0dnJ6eWlxc2xwZXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzAzNzIsImV4cCI6MjA5NTM0NjM3Mn0.t3zZqp_KSN3jwme7OSfA8SyGNDiEAWlETXeCxSxGt44";
        
        const db = window.supabase.createClient(CLOUD_URL, CLOUD_KEY);

        const MEMBER_KEY = "Choir2026";
        const ADMIN_KEY = "Admin2026";

        const sectionsList = [
            "Entrance", "Lord have mercy", "Gloria", "Responsorial Psalms", 
            "Acclamation", "Offertry", "Holy Holy", "The Mystery of Faith", 
            "Communion", "Recessional"
        ];

        let masterLibrary = [];
        let week1Data = { date: "Loading...", hymns: [] };
        let week2Data = { date: "Loading...", hymns: [] };

        let activeMemberWeek = "week1";
        let activeAdminWeek = "week1";
        let editingSongId = null;

        async function initializeCloudConnection() {
            await fetchAllCloudData();
            
            db.channel('cloud-sync')
                .on('postgres_changes', { event: '*', schema: 'public' }, async () => {
                    await fetchAllCloudData();
                    if (!document.getElementById('member-dashboard').classList.contains('hidden')) {
                        if (activeMemberWeek) renderMemberSetlist();
                        else filterMemberLibrary();
                    } else if (!document.getElementById('admin-dashboard').classList.contains('hidden')) {
                        if (document.getElementById('tab-library-manager').classList.contains('hidden') === false) {
                            filterAndRenderAdminLibrary();
                        } else {
                            generateAdminForm();
                        }
                    }
                })
                .subscribe();
        }

        async function fetchAllCloudData() {
            let { data: lib } = await db.from('hymns_library').select('*');
            masterLibrary = lib || [];
            
            let { data: scheds } = await db.from('schedules').select('*');
            if (scheds) {
                let w1 = scheds.find(s => s.week_key === 'week1');
                let w2 = scheds.find(s => s.week_key === 'week2');
                if (w1) week1Data = { date: w1.sunday_date, hymns: w1.hymns_array };
                if (w2) week2Data = { date: w2.sunday_date, hymns: w2.hymns_array };
            }
        }

        function handleLogin() {
            const pin = document.getElementById('password-input').value.trim();
            document.getElementById('error-msg').classList.add('hidden');

            if (pin === ADMIN_KEY) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                setupCategoryDropdowns();
                switchAdminTab('setlist');
            } else if (pin === MEMBER_KEY) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('member-dashboard').classList.remove('hidden');
                switchMemberTab('sunday');
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        function switchMemberTab(tab) {
            const btnSunday = document.getElementById('btn-mem-sunday');
            const btnLib = document.getElementById('btn-mem-lib');
            if (tab === 'sunday') {
                document.getElementById('tab-member-sunday').classList.remove('hidden');
                document.getElementById('tab-member-library').classList.add('hidden');
                btnSunday.className = "btn-admin"; btnLib.className = "btn-secondary";
                renderMemberSetlist();
            } else {
                document.getElementById('tab-member-sunday').classList.add('hidden');
                document.getElementById('tab-member-library').classList.remove('hidden');
                btnSunday.className = "btn-secondary"; btnLib.className = "btn-library";
                document.getElementById('member-search').value = "";
                renderMemberLibrary(masterLibrary);
            }
        }

        function switchMemberWeek(weekKey) {
            activeMemberWeek = weekKey;
            document.getElementById('btn-mem-week1').className = (weekKey === 'week1') ? "active-toggle" : "";
            document.getElementById('btn-mem-week2').className = (weekKey === 'week2') ? "active-toggle" : "";
            renderMemberSetlist();
        }

        function renderMemberSetlist() {
            const currentWorkingWeek = (activeMemberWeek === 'week1') ? week1Data : week2Data;
            document.getElementById('view-date').innerText = currentWorkingWeek.date || "No date set";
            const container = document.getElementById('setlist-render-area');
            container.innerHTML = "";

            if (!currentWorkingWeek.hymns || currentWorkingWeek.hymns.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#888;">No hymns published yet.</p>`;
                return;
            }

            currentWorkingWeek.hymns.forEach(hymn => {
                if (hymn.title && hymn.title !== "") {
                    const card = document.createElement('div');
                    card.className = "hymn-card";
                    card.onclick = function() { this.classList.toggle('active'); };
                    card.innerHTML = `
                        <div class="hymn-section">${hymn.section}</div>
                        <div class="hymn-title">${hymn.title}</div>
                        <div class="lyrics">${hymn.lyrics || 'No lyrics provided.'}</div>
                    `;
                    container.appendChild(card);
                }
            });
        }

        function renderMemberLibrary(songsToDisplay) {
            const container = document.getElementById('member-library-render-area');
            container.innerHTML = "";
            if (songsToDisplay.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#888;">No matching songs found.</p>`;
                return;
            }
            const sortedSongs = [...songsToDisplay].sort((a,b) => a.title.localeCompare(b.title));
            sortedSongs.forEach(song => {
                const card = document.createElement('div');
                card.className = "hymn-card lib-card";
                card.onclick = function() { this.classList.toggle('active'); };
                card.innerHTML = `
                    <div class="hymn-section" style="color: var(--library-color);">${song.category}</div>
                    <div class="hymn-title">${song.title}</div>
                    <div class="lyrics">${song.lyrics}</div>
                `;
                container.appendChild(card);
            });
        }

        function filterMemberLibrary() {
            const query = document.getElementById('member-search').value.toLowerCase().trim();
            const filtered = masterLibrary.filter(song => song.title.toLowerCase().includes(query));
            renderMemberLibrary(filtered);
        }

        function switchAdminWeek(weekKey) {
            activeAdminWeek = weekKey;
            document.getElementById('btn-adm-week1').className = (weekKey === 'week1') ? "active-toggle" : "";
            document.getElementById('btn-adm-week2').className = (weekKey === 'week2') ? "active-toggle" : "";
            
            // Show the copy option ONLY when viewing the 'Next Week' editing board
            const shiftBtnBlock = document.getElementById('shift-action-container');
            if (weekKey === 'week2') {
                shiftBtnBlock.classList.remove('hidden');
            } else {
                shiftBtnBlock.classList.add('hidden');
            }

            generateAdminForm();
        }

        function setupCategoryDropdowns() {
            const dropdown = document.getElementById('lib-new-category');
            dropdown.innerHTML = sectionsList.map(sec => `<option value="${sec}">${sec}</option>`).join('');

            const filterDropdown = document.getElementById('admin-filter-category');
            filterDropdown.innerHTML = `<option value="ALL">✨ Show All Categories</option>` + 
                sectionsList.map(sec => `<option value="${sec}">${sec}</option>`).join('');
        }

        function switchAdminTab(tabName) {
            const btnSunday = document.getElementById('btn-adm-sunday');
            const btnLib = document.getElementById('btn-adm-lib');
            if (tabName === 'setlist') {
                document.getElementById('tab-sunday-planner').classList.remove('hidden');
                document.getElementById('tab-library-manager').classList.add('hidden');
                btnSunday.className = "btn-admin"; btnLib.className = "btn-secondary";
                switchAdminWeek(activeAdminWeek);
            } else {
                document.getElementById('tab-sunday-planner').classList.add('hidden');
                document.getElementById('tab-library-manager').classList.remove('hidden');
                btnSunday.className = "btn-secondary"; btnLib.className = "btn-library";
                document.getElementById('shift-action-container').classList.add('hidden');
                cancelLibraryEdit();
                
                document.getElementById('admin-search').value = "";
                document.getElementById('admin-filter-category').value = "ALL";
                filterAndRenderAdminLibrary();
            }
        }

        function generateAdminForm() {
            const targetWeekData = (activeAdminWeek === 'week1') ? week1Data : week2Data;
            document.getElementById('edit-date').value = targetWeekData.date || "";
            const formContainer = document.getElementById('admin-form-fields');
            formContainer.innerHTML = "";

            sectionsList.forEach((section, index) => {
                const group = document.createElement('div');
                group.className = "form-group";
                
                const filteredSongs = masterLibrary
                    .filter(song => song.category === section)
                    .sort((a, b) => a.title.localeCompare(b.title));

                let optionsHtml = `<option value="">-- Skip Section --</option>`;
                filteredSongs.forEach(song => {
                    const selectedStr = (targetWeekData.hymns && targetWeekData.hymns[index] && targetWeekData.hymns[index].title === song.title) ? "selected" : "";
                    optionsHtml += `<option value="${song.title}" ${selectedStr}>${song.title}</option>`;
                });

                group.innerHTML = `
                    <label style="font-weight: bold; color: var(--accent-color);">${index + 1}. ${section}:</label>
                    <select id="select-${index}">${optionsHtml}</select>
                `;
                formContainer.appendChild(group);
            });
        }

        // NEW ENGINE FUNCTION: Clones Next Week (week2) into Current Week (week1) in the cloud database
        async function shiftNextWeekToCurrent() {
            if (week2Data.hymns.length === 0) {
                return alert("Next week's setlist is completely empty! Add some songs before copying.");
            }

            if (confirm("Are you sure you want to overwrite your Current Week setlist with everything planned in Next Week?")) {
                // Update row 'week1' using the exact array data stored in 'week2'
                await db.from('schedules').upsert({ 
                    week_key: "week1", 
                    sunday_date: week2Data.date, 
                    hymns_array: week2Data.hymns 
                }, { onConflict: 'week_key' });

                alert("Success! Next week's schedule has been pasted into Current Week and broadcast to all phones!");
                await fetchAllCloudData();
                switchAdminWeek('week1'); // Take admin back to view the newly updated Current Week panel
            }
        }

        async function addNewSongToLibrary() {
            const titleInput = document.getElementById('lib-new-title').value.trim();
            const categoryInput = document.getElementById('lib-new-category').value;
            const lyricsInput = document.getElementById('lib-new-lyrics').value.trim();

            if (!titleInput || !lyricsInput) return alert("Please fill out all fields!");

            await db.from('hymns_library').insert([{ title: titleInput, category: categoryInput, lyrics: lyricsInput }]);
            clearLibraryForm();
            await fetchAllCloudData();
            filterAndRenderAdminLibrary();
        }

        function startEditHymn(id) {
            const song = masterLibrary.find(s => s.id === id);
            if(!song) return;
            editingSongId = song.id;
            
            document.getElementById('library-form-title').innerText = "✏️ Edit Existing Song";
            document.getElementById('lib-new-title').value = song.title;
            document.getElementById('lib-new-category').value = song.category;
            document.getElementById('lib-new-lyrics').value = song.lyrics;

            document.getElementById('btn-library-save').classList.add('hidden');
            document.getElementById('edit-action-block').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function updateExistingSong() {
            if (!editingSongId) return;
            const newTitle = document.getElementById('lib-new-title').value.trim();
            const newCategory = document.getElementById('lib-new-category').value;
            const newLyrics = document.getElementById('lib-new-lyrics').value.trim();

            await db.from('hymns_library').update({ title: newTitle, category: newCategory, lyrics: newLyrics }).eq('id', editingSongId);
            
            cancelLibraryEdit();
            await fetchAllCloudData();
            filterAndRenderAdminLibrary();
        }

        async function deleteHymn(id) {
            if (confirm("Permanently delete this song from cloud?")) {
                await db.from('hymns_library').delete().eq('id', id);
                await fetchAllCloudData();
                filterAndRenderAdminLibrary();
            }
        }

        function cancelLibraryEdit() {
            editingSongId = null;
            document.getElementById('library-form-title').innerText = "Add New Song to Library";
            clearLibraryForm();
            document.getElementById('btn-library-save').classList.remove('hidden');
            document.getElementById('edit-action-block').classList.add('hidden');
        }

        function clearLibraryForm() {
            document.getElementById('lib-new-title').value = "";
            document.getElementById('lib-new-lyrics').value = "";
        }

        function filterAndRenderAdminLibrary() {
            const searchQuery = document.getElementById('admin-search').value.toLowerCase().trim();
            const categoryFilter = document.getElementById('admin-filter-category').value;
            const container = document.getElementById('library-preview-list');
            container.innerHTML = "";

            let filteredList = masterLibrary.filter(song => {
                const matchesSearch = song.title.toLowerCase().includes(searchQuery);
                const matchesCategory = (categoryFilter === "ALL" || song.category === categoryFilter);
                return matchesSearch && matchesCategory;
            });

            filteredList.sort((a, b) => a.title.localeCompare(b.title));

            if (filteredList.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#888; padding: 10px;">No matching hymns found.</p>`;
                return;
            }

            filteredList.forEach((song) => {
                const item = document.createElement('div');
                item.className = "lib-item";
                item.innerHTML = `
                    <div><b>${song.title}</b><br><span style="color:var(--library-color); font-size:11px;">${song.category}</span></div>
                    <div class="lib-actions">
                        <button onclick="startEditHymn(${song.id})" class="btn-edit">✏️</button>
                        <button onclick="deleteHymn(${song.id})" class="btn-danger">🗑️</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        async function saveAdminData() {
            const targetDate = document.getElementById('edit-date').value;
            const compiledHymns = sectionsList.map((section, index) => {
                const selectedTitle = document.getElementById(`select-${index}`).value;
                const matchedSong = masterLibrary.find(s => s.title === selectedTitle);
                return { section: section, title: selectedTitle, lyrics: matchedSong ? matchedSong.lyrics : "" };
            });

            await db.from('schedules').upsert({ 
                week_key: activeAdminWeek, 
                sunday_date: targetDate, 
                hymns_array: compiledHymns 
            }, { onConflict: 'week_key' });

            alert("Setlist broadcast live to all devices!");
            await fetchAllCloudData();
        }

        function logout() {
            document.getElementById('password-input').value = "";
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('member-dashboard').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        window.onload = function() {
            initializeCloudConnection().catch(err => console.log("Cloud connection waiting...", err));
        };
    </script>
</body>
</html>
